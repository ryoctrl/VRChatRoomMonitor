name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)".*/\1/p' src-tauri/Cargo.toml | head -n 1)
          echo "version=$version tag=$GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"

  build:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: VRChatRoomMonitor
          path: assets
      # 秘密鍵に触れるのは、外部のビルド処理が動かないこのジョブのこの手順だけにする
      - name: Sign the installer and write the update manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="VRChatRoomMonitor-$version-setup.exe"
          npx --yes @tauri-apps/cli@2.12.4 signer sign "assets/$installer"
          jq -n \
            --arg version "$version" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile signature "assets/$installer.sig" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$installer" \
            '{version: $version, pub_date: $date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' \
            > assets/latest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
