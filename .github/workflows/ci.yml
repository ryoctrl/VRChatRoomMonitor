name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Generate third-party notices
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          ./scripts/generate-notices.ps1
      - name: Build frontend
        run: pnpm build
      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      # アプリ本体（Tauri）のテストは無いので除外する。ロジックは crates/ でテストしている
      - name: Test Rust
        run: cargo test --workspace --exclude vrchat-room-monitor
      - name: Build app
        run: pnpm tauri build
      - name: Smoke test
        run: cargo run -p smoke-test -- target/release/VRChatRoomMonitor.exe
      - name: Package
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VRChatRoomMonitor
          path: artifacts/*
          if-no-files-found: error
