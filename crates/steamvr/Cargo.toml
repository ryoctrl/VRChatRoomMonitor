[package]
name = "steamvr"
version = "0.0.0"
description = "SteamVR（OpenVR）への登録と、SteamVR の起動・終了の検知"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }

[lints]
workspace = true
