<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRChat Room Monitor</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header>
      <p id="status" class="status"></p>
      <h1 id="world">—</h1>
      <p id="instance" class="sub"></p>
    </header>

    <div id="update" class="update" hidden>
      <span id="update-text"></span>
      <button id="update-action" type="button"></button>
    </div>

    <main>
      <section class="panel players">
        <h2 id="count">ルーム内 —</h2>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th class="name">名前</th>
                <th class="fixed">入室</th>
                <th class="fixed">経過</th>
              </tr>
            </thead>
            <tbody id="players"></tbody>
          </table>
        </div>
      </section>

      <section class="panel feed">
        <div class="panel-head">
          <h2>入退室ログ</h2>
          <label>
            <input type="checkbox" data-setting="currentWorldOnly" />現在のワールドのみ
          </label>
        </div>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th class="time">時刻</th>
                <th>内容</th>
              </tr>
            </thead>
            <tbody id="feed"></tbody>
          </table>
          <p id="feed-empty" class="sub empty" hidden>ワールドに入ると表示します</p>
        </div>
      </section>
    </main>

    <footer>
      <div class="options">
        <label><input type="checkbox" data-setting="alwaysOnTop" />常に最前面</label>
        <label><input type="checkbox" data-setting="popup" />ポップアップ</label>
        <label><input type="checkbox" data-setting="sound" />通知音</label>
        <label><input type="checkbox" data-setting="notifyLeave" />退室も通知</label>
        <label title="ウィンドウの題名を「VRChat Room Monitor」のままにします（ウィンドウキャプチャ用）">
          <input type="checkbox" data-setting="fixedTitle" />タイトルを固定
        </label>
      </div>
      <div class="options sounds">
        <label>入室の音<select data-sound="soundJoin"></select></label>
        <label>退室の音<select data-sound="soundLeave"></select></label>
        <label>招待などの音<select data-sound="soundNotice"></select></label>
      </div>
      <div class="options steamvr">
        <label><input id="steamvr-autostart" type="checkbox" />SteamVR と同時に起動</label>
        <span id="steamvr-status" class="sub"></span>
      </div>
      <div class="options links">
        <label><input type="checkbox" data-setting="checkUpdates" />更新を確認</label>
        <span id="version" class="sub version"></span>
        <button id="steamvr-remove" type="button" class="link">SteamVR の一覧から削除</button>
        <button id="licenses" type="button" class="link">ライセンス</button>
      </div>
    </footer>
  </body>
</html>
