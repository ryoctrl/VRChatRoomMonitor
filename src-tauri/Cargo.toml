[package]
name = "vrchat-room-monitor"
version = "0.2.3"
description = "VRChat のログを監視して、現在のルームの状況と入退室の記録をデスクトップに表示する"
authors = ["RYOCTRL"]
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
monitor-core = { path = "../crates/monitor-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamvr = { path = "../crates/steamvr" }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio"] }

[lints]
workspace = true
